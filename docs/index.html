<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>酒類比價</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: a buyer's working price sheet — calm, exact, scannable
   IDEA: a wine-merchant stock ledger with a labelled shelf header
   PICTURE: the filter bar + live product table itself, bottle glyphs per row
   COLOUR and TYPE: oxblood band, white sheet, one gold accent for promo prices; Noto Sans TC
   LAYOUT: band header with site/brand selectors, site status chips, then the table */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4f2,#141012);--sheet:light-dark(#fff,#1d1719);--ink:light-dark(#1b1416,#f1eaec);
--mute:light-dark(#6d6266,#a89a9f);--line:light-dark(#e6e0e1,#33292c);--band:#5a1424;--band2:#7a1d31;
--gold:light-dark(#a86a00,#f0b545);--ok:light-dark(#1d7a46,#5fd08f);--warn:light-dark(#b0481a,#ff9e6b)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans TC",system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(22px,3.5vw,44px) max(4vw,16px)}
header.band{background:linear-gradient(160deg,var(--band),var(--band2));color:#fff;padding-bottom:28px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.1;margin:0 0 6px;font-weight:900;text-wrap:balance}
.sub{margin:0 0 20px;opacity:.85;font-size:15px}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;max-width:1240px}
.ctl label{display:flex;flex-direction:column;font-size:13px;font-weight:500;gap:4px;opacity:.95}
select,input{font:inherit;font-size:16px;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid #ffffff55;background:#ffffff18;color:#fff}
select option,select optgroup{background:var(--sheet);color:var(--ink)}
select:focus-visible,input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #ffd56b;outline-offset:2px}
input::placeholder{color:#ffffffaa}
main{max-width:1240px;margin:0 auto;padding:0 max(4vw,16px) 48px}
.sites{display:flex;flex-wrap:wrap;gap:10px;margin:-18px 0 22px;position:relative}
.chip{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 2px 8px #0000000f;cursor:pointer;min-height:44px;text-align:left;color:var(--ink);font-family:inherit}
.chip b{display:block;font-size:14px}
.chip .st{font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}
.chip[aria-pressed=true]{border-color:var(--band2);box-shadow:0 0 0 2px var(--band2)}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:10px}
.meta h2{font-size:20px;margin:0}
.note{font-size:13px;color:var(--mute)}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:light-dark(#f3eced,#261d20);text-align:left;font-weight:700;font-size:13px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th[data-k]:not([data-k=img]){cursor:pointer}
th[data-k]:not([data-k=img]):hover{background:light-dark(#eadfe1,#30252a)}
th[data-k]:not([data-k=img])::after{content:"⇅";margin-left:6px;opacity:.35;font-size:12px}
th[aria-sort=ascending]::after{content:"▲"!important;opacity:1!important;color:var(--band2)}
th[aria-sort=descending]::after{content:"▼"!important;opacity:1!important;color:var(--band2)}
th[aria-sort]{color:var(--band2)}
:root[data-theme=dark] th[aria-sort],:root[data-theme=dark] th[aria-sort]::after{color:#f0a3b3}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) th[aria-sort],:root:not([data-theme=light]) th[aria-sort]::after{color:#f0a3b3}}
th.n,td.n{text-align:right}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n{white-space:nowrap;font-variant-numeric:tabular-nums}
.img{width:64px}
.img a,.img span{display:inline-flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mute);text-decoration:none;gap:2px}
.brand{font-weight:700}
.name a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}
.site{display:block;font-size:12px;color:var(--mute)}
.promo{color:var(--gold);font-weight:700}
.strike{color:var(--mute);text-decoration:line-through;text-decoration-thickness:1px}
.na{color:var(--mute)}
.stock{font-size:13px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--mute)}
details{margin-top:28px;background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
summary{cursor:pointer;font-weight:700;min-height:28px}
details li{margin:6px 0;font-size:15px}
.img img{width:56px;height:56px;object-fit:contain;display:block;background:#fff;border-radius:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:8px;background:var(--band);color:#fff;text-decoration:none;font-size:14px;font-weight:500;border:0;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.more{display:flex;justify-content:center;padding:16px}
.chip .t{display:block;font-size:11px;color:var(--mute)}
.lb{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:#000a;backdrop-filter:blur(2px)}
.lb[hidden]{display:none}
.lb-box{position:relative;background:var(--sheet);color:var(--ink);border-radius:14px;max-width:min(560px,100%);width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px #0008;padding:20px}
.lb-img{display:flex;align-items:center;justify-content:center;background:#fff;border-radius:10px;min-height:260px}
.lb-img img{max-width:100%;max-height:60vh;object-fit:contain;display:block}
.lb-x{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;border-radius:50%;background:var(--band);color:#fff;font-size:24px;line-height:1;cursor:pointer;z-index:2}
.lb-x:hover{background:var(--band2)}
.lb-nav{position:absolute;top:150px;width:44px;height:44px;border:0;border-radius:50%;background:#0006;color:#fff;font-size:22px;cursor:pointer}
.lb-nav[hidden]{display:none}
.lb-prev{left:8px}.lb-next{right:8px}
.lb-info{margin-top:14px}
.lb-info b{display:block;font-size:13px;color:var(--mute);font-weight:500}
.lb-info h3{margin:2px 0 8px;font-size:18px;line-height:1.35}
.lb-info .row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;font-size:15px}
.lb-info .btn{margin-top:12px}
.img button{border:0;background:none;padding:0;cursor:zoom-in;display:block}
@media(max-width:600px){table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 12px;padding-inline-start:8em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--mute)}.stack td:empty{display:none}.stack td.n{text-align:start}}
@media(prefers-reduced-motion:no-preference){tbody tr{animation:in .25s ease both}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="band">
  <h1>酒類比價表</h1>
  <p class="sub" id="sub">6 個酒類電商的商品、容量、濃度、價格與庫存，每天自動更新。</p>
  <div class="ctl">
    <label>網站<select id="fSite"></select></label>
    <label>品牌（英文為主）<select id="fBrand"></select></label>
    <label>關鍵字<input id="fQ" type="search" placeholder="例如 12Y、Gin、香檳"></label>
    <label>只看<select id="fOnly"><option value="">全部商品</option><option value="promo">有促銷價</option><option value="instock">排除缺貨</option></select></label>
  </div>
</header>
<main>
  <div class="sites" id="sites"></div>
  <div class="meta"><h2 id="cnt">載入中…</h2>
    <div class="tools"><span class="note" id="sortNote">點欄位標題可排序（價格依台幣約略換算）</span><a class="btn" href="products.xlsx">下載 Excel</a></div></div>
  <div class="sheet"><table class="stack" id="tbl">
    <thead><tr><th data-k="img">商品圖片</th><th data-k="brand">品牌</th><th data-k="name">品名</th><th data-k="volume_ml" class="n">容量</th><th data-k="abv" class="n">酒精濃度</th><th data-k="list_price" class="n">訂價</th><th data-k="promo_price" class="n">促銷價</th><th data-k="stock">庫存</th></tr></thead>
    <tbody id="rows"></tbody>
  </table><div class="more" id="more" hidden><button class="btn ghost" id="moreBtn">顯示更多</button></div></div>
  <details>
    <summary>各網站抓取狀態</summary>
    <ul id="notes"></ul>
  </details>
</main>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="商品圖片">
  <div class="lb-box">
    <div class="lb-img" id="lbImg"></div>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="上一個">&#8249;</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="下一個">&#8250;</button>
    <button class="lb-x" id="lbX" aria-label="關閉">&times;</button>
    <div class="lb-info" id="lbInfo"></div>
  </div>
</div>
<script>
{
const CUR={TWD:'NT$',SGD:'S$',HKD:'HK$',CNY:'¥',USD:'US$'};
const PAGE=200;
// 只用來排序的約略匯率（換算成台幣），不顯示在表格上
const TWD={TWD:1,SGD:24,HKD:4.1,CNY:4.4,USD:32};
const LABEL={brand:'品牌',name:'品名',volume_ml:'容量',abv:'酒精濃度',list_price:'訂價',promo_price:'促銷價',stock:'庫存'};
const sortVal=(r,k)=>{
  if(k==='list_price'||k==='promo_price'){const v=r[k];return v==null||!v?null:v*(TWD[r.currency]||1)}
  const v=r[k];return v===''||v===undefined?null:v};
let D=[],VIEW=[],SITES={},show=PAGE,sortK=null,sortDir=1,st={site:'',brand:''};
try{Object.assign(st,JSON.parse(localStorage.getItem('lq')||'{}'))}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const bottle=c=>`<svg width="22" height="44" viewBox="0 0 22 44" aria-hidden="true"><rect x="8" y="1" width="6" height="11" rx="1.5" fill="${c}"/><path d="M8 12 Q3 16 3 21 V40 Q3 43 6 43 H16 Q19 43 19 40 V21 Q19 16 14 12Z" fill="${c}"/><rect x="5" y="25" width="12" height="9" rx="1" fill="#fff" opacity=".75"/></svg>`;
const col=r=>/紅酒|Cabernet|Shiraz|Pinot|Tempranillo|橘酒/i.test(r.name)?'#7a1d31':/香檳|Champagne|氣泡|Brut/i.test(r.name)?'#b8963a':/Gin|琴酒|Vodka|伏特加|Tequila|龍舌蘭/i.test(r.name+r.brand)?'#5b8fa8':/吟釀|清酒|sake/i.test(r.name)?'#8aa37b':'#9a5a1e';
const money=(v,c)=>v==null?'<span class="na">—</span>':esc(CUR[c]||c||'')+' '+Number(v).toLocaleString('en',{minimumFractionDigits:(c==='TWD'||Number.isInteger(v))?0:2,maximumFractionDigits:2});
const fmtTime=t=>{if(!t)return'尚未成功';const d=new Date(t);return isNaN(d)?t:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
window.__imgFail=img=>{const c=img.dataset.c;img.replaceWith(Object.assign(document.createElement('span'),{innerHTML:bottle(c)}))};

const fillSites=()=>{
  $('fSite').innerHTML='<option value="">全部網站</option>'+Object.values(SITES).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
  $('sites').innerHTML=Object.values(SITES).map(s=>{
    const ok=(s.status==='ok'||s.status==='demo'||s.status==='local')&&s.count>0;
    const lbl=s.status==='demo'?'示範資料':s.status==='ok'?'正常':s.status==='local'?'自己電腦更新':s.status==='local-none'?'待自己電腦執行':s.status==='empty'?'這次沒抓到':s.status==='error'?'抓取失敗':'未執行';
    return `<button class="chip" data-k="${esc(s.id)}" aria-pressed="false"><b>${esc(s.name)}</b><span class="st ${ok?'ok':'warn'}">● ${esc(lbl)}・${s.count} 筆</span><span class="t">更新：${esc(fmtTime(s.last_success))}</span></button>`}).join('');
  $('notes').innerHTML=Object.values(SITES).map(s=>`<li><b>${esc(s.name)}</b>（${esc(s.how)}）：${esc(s.message||'—')}</li>`).join('');
  document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{st.site=st.site===c.dataset.k?'':c.dataset.k;show=PAGE;fillBrands();render()}));
};
const fillBrands=()=>{
  const bs=[...new Set(D.filter(r=>!st.site||r.site===st.site).map(r=>r.brand).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'en'));
  if(st.brand&&!bs.includes(st.brand))st.brand='';
  $('fBrand').innerHTML='<option value="">全部品牌</option>'+bs.map(b=>`<option>${esc(b)}</option>`).join('');
  $('fBrand').value=st.brand;
};
const render=()=>{
  const q=$('fQ').value.trim().toLowerCase(),only=$('fOnly').value;
  let rows=D.filter(r=>(!st.site||r.site===st.site)&&(!st.brand||r.brand===st.brand)
    &&(!q||((r.brand||'')+' '+(r.name||'')).toLowerCase().includes(q))
    &&(only!=='promo'||r.promo_price!=null)&&(only!=='instock'||r.stock!=='缺貨'));
  if(sortK)rows.sort((a,b)=>{const x=sortVal(a,sortK),y=sortVal(b,sortK);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(typeof x==='number'?x-y:String(x).localeCompare(String(y),'zh-Hant'))*sortDir});
  document.querySelectorAll('th[data-k]').forEach(th=>{if(th.dataset.k===sortK)th.setAttribute('aria-sort',sortDir>0?'ascending':'descending');else th.removeAttribute('aria-sort')});
  $('sortNote').textContent=sortK?`依「${LABEL[sortK]}」${sortDir>0?'由小到大':'由大到小'}排序・再點一次反轉，點第三次取消`:'點欄位標題可排序（價格依台幣約略換算）';
  const site=SITES[st.site];
  $('cnt').textContent=`${rows.length} 件商品`+(site?`・${site.name}`:'')+(st.brand?`・${st.brand}`:'');
  VIEW=rows;
  $('rows').innerHTML=rows.length?rows.slice(0,show).map((r,i)=>{
    const img=safeUrl(r.image),url=safeUrl(r.url);
    const im=img?`<button type="button" data-i="${i}" title="放大圖片"><img src="${esc(img)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-c="${col(r)}" onerror="__imgFail(this)"></button>`:`<span>${bottle(col(r))}</span>`;
    const nm=url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name);
    const hasP=r.promo_price!=null&&r.list_price!=null&&r.promo_price<r.list_price;
    const sc=r.stock?(/缺貨|少量|Few/i.test(r.stock)?'warn':'ok'):'';
    return `<tr><td class="img">${im}</td><td class="brand">${esc(r.brand)}</td><td class="name">${nm}<span class="site">${esc(SITES[r.site]?.name||r.site)}</span></td>
    <td class="n">${r.volume_ml?esc(r.volume_ml)+' ml':'<span class="na">—</span>'}</td><td class="n">${r.abv!=null?esc(r.abv)+'%':'<span class="na">—</span>'}</td>
    <td class="n ${hasP?'strike':''}">${money(r.list_price,r.currency)}</td><td class="n ${r.promo_price!=null?'promo':''}">${money(r.promo_price,r.currency)}</td>
    <td class="stock ${sc}">${r.stock?esc(r.stock):'<span class="na">—</span>'}</td></tr>`}).join('')
    :`<tr><td colspan="8" class="empty">${site&&!site.count?'這個網站目前沒有資料，原因見下方「各網站抓取狀態」。':'沒有符合條件的商品。'}</td></tr>`;
  $('more').hidden=rows.length<=show;
  $('moreBtn').textContent=`顯示更多（還有 ${Math.max(0,rows.length-show)} 件）`;
  $('fSite').value=st.site;
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.k===st.site));
  try{localStorage.setItem('lq',JSON.stringify(st))}catch(e){}
};
$('fSite').addEventListener('change',e=>{st.site=e.target.value;show=PAGE;fillBrands();render()});
$('fBrand').addEventListener('change',e=>{st.brand=e.target.value;show=PAGE;render()});
$('fQ').addEventListener('input',()=>{show=PAGE;render()});$('fOnly').addEventListener('change',render);
$('moreBtn').addEventListener('click',()=>{show+=PAGE;render()});
document.querySelectorAll('th[data-k]').forEach(th=>{
  if(th.dataset.k==='img')return;
  th.tabIndex=0;th.title='點一下排序';
  const go=()=>{const k=th.dataset.k;
    if(sortK!==k){sortK=k;sortDir=1}else if(sortDir===1){sortDir=-1}else{sortK=null;sortDir=1}
    st.sortK=sortK;st.sortDir=sortDir;show=PAGE;render()};
  th.addEventListener('click',go);th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}});
});
if(st.sortK&&LABEL[st.sortK]){sortK=st.sortK;sortDir=st.sortDir===-1?-1:1}
// ---- 圖片放大視窗 ----
const lbShow=i=>{
  const withImg=VIEW.map((r,j)=>safeUrl(r.image)?j:-1).filter(j=>j>=0);
  if(!withImg.length)return;
  if(!withImg.includes(i))i=withImg[0];
  const r=VIEW[i],url=safeUrl(r.url);
  $('lbImg').innerHTML=`<img src="${esc(safeUrl(r.image))}" alt="${esc(r.name)}" referrerpolicy="no-referrer">`;
  const hasP=r.promo_price!=null&&r.list_price!=null&&r.promo_price<r.list_price;
  $('lbInfo').innerHTML=`<b>${esc(r.brand)}・${esc(SITES[r.site]?.name||r.site)}</b><h3>${esc(r.name)}</h3>
    <div class="row">${r.volume_ml?`<span>${esc(r.volume_ml)} ml</span>`:''}${r.abv!=null?`<span>${esc(r.abv)}%</span>`:''}
    <span class="${hasP?'strike':''}">${money(r.list_price,r.currency)}</span>${r.promo_price!=null?`<span class="promo">${money(r.promo_price,r.currency)}</span>`:''}
    ${r.stock?`<span class="stock">${esc(r.stock)}</span>`:''}</div>
    ${url?`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener">到原網站看商品</a>`:''}`;
  const pos=withImg.indexOf(i);
  $('lbPrev').hidden=pos<=0;$('lbNext').hidden=pos>=withImg.length-1;
  $('lbPrev').onclick=()=>lbShow(withImg[pos-1]);$('lbNext').onclick=()=>lbShow(withImg[pos+1]);
  if($('lb').hidden){$('lb').hidden=false;document.body.style.overflow='hidden';$('lbX').focus()}
};
const lbClose=()=>{$('lb').hidden=true;document.body.style.overflow=''};
$('rows').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)lbShow(+b.dataset.i)});
$('lbX').addEventListener('click',lbClose);
$('lb').addEventListener('click',e=>{if(e.target===$('lb'))lbClose()});
document.addEventListener('keydown',e=>{if($('lb').hidden)return;
  if(e.key==='Escape')lbClose();
  else if(e.key==='ArrowLeft'&&!$('lbPrev').hidden)$('lbPrev').click();
  else if(e.key==='ArrowRight'&&!$('lbNext').hidden)$('lbNext').click()});
// 本機報表（report.html）把資料直接放在網頁裡；網站版則從 data/ 讀取
(window.__PRODUCTS__&&window.__SITES__?Promise.resolve([window.__PRODUCTS__,window.__SITES__]):
 Promise.all([fetch('data/products.json',{cache:'no-store'}).then(r=>r.json()),fetch('data/sites.json',{cache:'no-store'}).then(r=>r.json())]))
.then(([p,s])=>{D=p;SITES=Object.fromEntries(s.sites.map(x=>[x.id,x]));$('sub').textContent=`6 個酒類電商，共 ${p.length} 件商品。最後更新：${fmtTime(s.updated)}`;
