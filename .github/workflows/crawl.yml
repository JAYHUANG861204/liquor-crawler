name: 每日爬蟲

on:
  schedule:
    # GitHub 用 UTC 時間；00:00 UTC = 台灣時間早上 08:00
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "只跑哪些網站（逗號分隔，空白 = 全部）：609,changi,hk,9city,my9,cdf"
        required: false
        default: ""
      limit:
        description: "每站最多幾筆（測試用，空白 = 不限）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 執行爬蟲
        env:
          SITES: ${{ github.event.inputs.sites }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS=""
          [ -n "$SITES" ] && ARGS="$ARGS --sites $SITES"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          python -m crawler.run $ARGS

      - name: 儲存結果
        run: |
          git config user.name "liquor-crawler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/products.xlsx
          if git diff --cached --quiet; then
            echo "資料沒有變動"
          else
            git commit -m "更新商品資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
