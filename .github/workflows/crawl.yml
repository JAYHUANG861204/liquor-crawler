name: 每日爬蟲

on:
  schedule:
    # GitHub 用 UTC 時間；00:00 UTC = 台灣時間早上 08:00
    - cron: "0 0 * * *"
  # 修改 .github/run-now.txt 並推上來，也會立刻執行一次（方便改完程式馬上重抓）
  push:
    branches: [main]
    paths: [".github/run-now.txt"]
  workflow_dispatch:
    inputs:
      sites:
        description: "只跑哪些網站（逗號分隔，大小寫都可，空白 = 全部）：609, changi, hk, 9city, my9, cdf"
        required: false
        default: ""
      limit:
        description: "每站最多幾筆（測試用，空白 = 不限）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 執行爬蟲
        env:
          SITES: ${{ github.event.inputs.sites }}
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS=""
          [ -n "$SITES" ] && ARGS="$ARGS --sites $SITES"
          [ -n "$LIMIT" ] && ARGS="$ARGS --limit $LIMIT"
          python -m crawler.run $ARGS 2>&1 | tee crawl-output.log
          rc=${PIPESTATUS[0]}
          python -m crawler.audit --samples 2 2>&1 | tee -a crawl-output.log || true
          exit $rc

      - name: 儲存結果
        if: always()
        run: |
          git config user.name "liquor-crawler-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 以 GitHub 最新版為底，只換掉這次跑完的網站（不會蓋掉在自己電腦上傳的 9city 等資料）
          python -m crawler.publish "更新商品資料 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
